name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run validate:geojson

      - run: npm run lint

      - run: npm run typecheck

      - name: Build
        env:
          VITE_MAPBOX_TOKEN: pk.ci_placeholder_token_for_build_only
        run: npm run build
