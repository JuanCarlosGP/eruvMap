name: Proponer un eruv
description: Sugiere un eruv nuevo o una corrección al perímetro o metadatos
title: '[Eruv] '
labels: ['contribución', 'datos', 'propuesta']
body:
  - type: markdown
    attributes:
      value: |
        Gracias por ayudar a ampliar **eruvMap**. Revisa [CONTRIBUTING.md](https://github.com/JuanCarlosGP/eruvMap/blob/main/CONTRIBUTING.md) y [`data/SOURCES.md`](https://github.com/JuanCarlosGP/eruvMap/blob/main/data/SOURCES.md). **Arrastra la foto de verificación a este issue** si usaste la herramienta del mapa (la imagen no se almacena en el sitio).

  - type: input
    id: name_en
    attributes:
      label: Nombre (inglés, name_en)
    validations:
      required: true

  - type: input
    id: name_he
    attributes:
      label: Nombre en hebreo (name_he, opcional)

  - type: input
    id: city
    attributes:
      label: Ciudad (city)
    validations:
      required: true

  - type: input
    id: country
    attributes:
      label: País (country)
    validations:
      required: true

  - type: dropdown
    id: geometry_kind
    attributes:
      label: geometry_kind
      options:
        - perimeter
        - point
    validations:
      required: true

  - type: dropdown
    id: geometry_precision
    attributes:
      label: geometry_precision
      options:
        - exact
        - approximate
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: status
      options:
        - active
        - unknown
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Fuente (source)
    validations:
      required: true

  - type: input
    id: source_url
    attributes:
      label: URL de la fuente (source_url)
    validations:
      required: true

  - type: input
    id: license
    attributes:
      label: Licencia (license)
      placeholder: ODbL OpenStreetMap contributors
    validations:
      required: true

  - type: input
    id: verified_at
    attributes:
      label: Fecha de verificación (verified_at, AAAA-MM-DD)
    validations:
      required: true

  - type: input
    id: contact_url
    attributes:
      label: URL de contacto (opcional)

  - type: input
    id: verification_photo
    attributes:
      label: Ubicación de la foto de prueba (lat, lng — sin subir imagen)

  - type: input
    id: photo_distance_m
    attributes:
      label: Distancia foto ↔ eruv dibujado (metros)

  - type: textarea
    id: contribution_context
    attributes:
      label: Notas de la herramienta de contribución
      description: Recordatorios (p. ej. pegar GeoJSON desde el portapapeles).

  - type: textarea
    id: note
    attributes:
      label: Nota (opcional; indica si es partial segment)

  - type: textarea
    id: geometria
    attributes:
      label: Geometría (GeoJSON)
      description: Feature completo o geometría (Polygon, LineString, MultiLineString, Point).
    validations:
      required: true

  - type: checkboxes
    id: confirmacion
    attributes:
      label: Confirmación
      options:
        - label: Confirmo permiso o fuente pública para publicar estos datos
          required: true
        - label: Entiendo que un mantenedor revisará antes de fusionar en data/eruvs.geojson
          required: true
